name: Atualizar JSONs das planilhas

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h de Brasília
    - cron: "0 15 * * *" # todo dia às 12h de Brasília
    - cron: "0 21 * * *" # todo dia às 18h de Brasília
    - cron: "0 3 * * *" # todo dia às 0h de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-jsons
  cancel-in-progress: false

# Todas as abas vêm da planilha unificada (jsonucops _uni); cada aba gera <aba>.json; as chaves do JSON são os nomes das colunas.
# Links CSV das planilhas publicadas na web (Arquivo > Compartilhar > Publicar na web).
# Para trocar uma planilha, basta trocar o link aqui.
env:
  CSV_GLOSSARIO: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=241704941&single=true&output=csv
  CSV_CALENDARIO: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=1577044784&single=true&output=csv
  CSV_ACERVO: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=1162851248&single=true&output=csv
  CSV_REFERENCIAS: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=1312179170&single=true&output=csv
  CSV_PERSONAS: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=1545420504&single=true&output=csv
  CSV_DADOS: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=1385159613&single=true&output=csv
  CSV_ENTIDADES: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=1191365067&single=true&output=csv
  CSV_LEGISLACAO: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=963808734&single=true&output=csv
  CSV_AULAS: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=1749439585&single=true&output=csv
  CSV_TESE: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=817455841&single=true&output=csv
  CSV_HISTORIAS: https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ2j3CVU4NRKiSq2aj0Mxrp2b1sXbb4MmF8P69Cnzc0AGhb2tAtLsQgZDgv7s5tJXP-wxnKh09-1lQ/pub?gid=960209600&single=true&output=csv

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cada passo é independente: se uma planilha falhar, as outras seguem
      # e o JSON antigo daquela planilha continua no repositório.
      - name: Gerar glossario.json
        id: glossario
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_GLOSSARIO }}" }
        run: python scripts/gerar_glossario.py

      - name: Gerar eventos.json
        id: calendario
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_CALENDARIO }}" }
        run: python scripts/gerar_eventos.py

      - name: Gerar acervo.json
        id: acervo
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_ACERVO }}" }
        run: python scripts/gerar_acervo.py

      - name: Gerar referencias.json
        id: referencias
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_REFERENCIAS }}" }
        run: python scripts/gerar_referencias.py

      - name: Gerar personalidades.json
        id: personas
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_PERSONAS }}" }
        run: python scripts/gerar_personalidades.py

      - name: Gerar dados.json
        id: dados
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_DADOS }}" }
        run: python scripts/gerar_dados.py

      - name: Gerar politicas.json
        id: politicas
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_LEGISLACAO }}" }
        run: python scripts/gerar_politicas.py

      # Entidades e aulas por último, porque conferem ids nos JSONs acima
      - name: Gerar entidades.json
        id: entidades
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_ENTIDADES }}" }
        run: python scripts/gerar_entidades.py

      - name: Gerar aulas.json
        id: aulas
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_AULAS }}" }
        run: python scripts/gerar_aulas.py

      - name: Gerar tese.json
        id: tese
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_TESE }}" }
        run: python scripts/gerar_tese.py

      - name: Gerar historias.json
        id: historias
        continue-on-error: true
        env: { CSV_URL: "${{ env.CSV_HISTORIAS }}" }
        run: python scripts/gerar_historias.py

      - name: Salvar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          if git diff --staged --quiet; then
            echo "Nenhum JSON mudou."
          else
            git commit -m "Atualiza JSONs das planilhas"
            git pull origin main --rebase
            git push
          fi

      - name: Avisar se alguma planilha falhou
        if: always()
        run: |
          falhas=""
          [ "${{ steps.glossario.outcome }}" = "failure" ] && falhas="$falhas glossario"
          [ "${{ steps.calendario.outcome }}" = "failure" ] && falhas="$falhas calendario"
          [ "${{ steps.acervo.outcome }}" = "failure" ] && falhas="$falhas acervo"
          [ "${{ steps.referencias.outcome }}" = "failure" ] && falhas="$falhas referencias"
          [ "${{ steps.personas.outcome }}" = "failure" ] && falhas="$falhas personas"
          [ "${{ steps.dados.outcome }}" = "failure" ] && falhas="$falhas dados"
          [ "${{ steps.politicas.outcome }}" = "failure" ] && falhas="$falhas politicas"
          [ "${{ steps.entidades.outcome }}" = "failure" ] && falhas="$falhas entidades"
          [ "${{ steps.aulas.outcome }}" = "failure" ] && falhas="$falhas aulas"
          [ "${{ steps.tese.outcome }}" = "failure" ] && falhas="$falhas tese"
          [ "${{ steps.historias.outcome }}" = "failure" ] && falhas="$falhas historias"
          if [ -n "$falhas" ]; then
            echo "::error::Falharam:$falhas (os JSONs antigos dessas planilhas foram mantidos)"
            exit 1
          fi
          echo "Todas as planilhas foram lidas."
